<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Votação - Encontro Institucional COREN-PE</title>
    <!-- Ligação para o ficheiro CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Premiação Destaques 2026</h1>
    
    <!-- Ecrã de Login -->
    <div id="login-section">
        <h2>Acesso à Votação</h2>
        <form id="form-login">
            <label for="nome-login">Nome Completo</label>
            <input type="text" id="nome-login" required placeholder="Digite o seu nome completo">

            <label for="cpf-login">CPF</label>
            <input type="text" id="cpf-login" required placeholder="000.000.000-00" maxlength="14">

            <button type="submit">Entrar</button>
        </form>
    </div>

    <!-- Ecrã de Votação (Passo a Passo) -->
    <div id="votacao-section">
        <!-- Barra de Progresso -->
        <div class="progress-wrapper">
            <div class="progress-info">
                <span id="progresso-texto">Passo 1 de 5</span>
                <span style="font-weight: normal;">Eleitor: <strong id="nome-exibicao" style="color: var(--primary-color);"></strong></span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progresso-barra"></div>
            </div>
        </div>

        <form id="form-votacao">
            <!-- As etapas dos cargos serão injetadas aqui pelo JavaScript -->
            <div id="secoes-votacao"></div>
            
            <!-- Botões de Navegação -->
            <div class="navegacao-botoes">
                <button type="button" id="btn-anterior" class="btn-secundario" style="display: none;">Voltar</button>
                <button type="button" id="btn-proximo">Avançar para o Próximo Cargo</button>
                <button type="submit" id="btn-confirmar" style="display: none;">Finalizar e Enviar Votos</button>
            </div>
        </form>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
