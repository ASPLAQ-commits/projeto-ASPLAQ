<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Votação Destaques 2026 - COREN-PE</title>

    <link rel="stylesheet" href="style.css">

    <!-- Biblioteca do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- TELA 1: LOGIN -->
    <div id="tela-login" class="container">
        <img src="coren_logo.png" alt="Logo COREN-PE" class="logo-institucional">

        <h2>Votação Destaques 2026</h2>
        <p>Insira seu e-mail institucional para acessar a urna.</p>

        <input type="email" id="input-email" placeholder="E-mail (@coren-pe.gov.br)" required>
        <button onclick="validarAcesso()" id="btn-entrar">Acessar Urna</button>

        <div id="msg-erro" class="mensagem-erro" style="display: none;"></div>
    </div>

    <!-- TELA 2: URNA (uma etapa por categoria, candidatos agrupados por setor) -->
    <div id="tela-urna" class="container" style="display: none;">

        <div class="cabecalho-usuario">
            <img src="coren_logo.png" alt="Logo COREN-PE" class="logo-cabecalho">
            <img id="foto-usuario" class="foto-usuario-header" src="" alt="">
            <div class="info-usuario-header">
                <h2 id="saudacao-usuario">Olá, Colaborador!</h2>
                <p class="badge-setor">
                    <span id="badge-setor-usuario"></span>
                    <span id="badge-cargo-usuario"></span>
                </p>
            </div>
        </div>

        <div class="progress-wrapper">
            <div class="progress-info"><span id="progresso-texto"></span></div>
            <div class="progress-bar-bg"><div class="progress-bar-fill" id="progresso-barra"></div></div>
        </div>

        <form id="form-voto" onsubmit="revisarVoto(event)">
            <div id="secoes-votacao"></div>

            <div class="navegacao-botoes">
                <button type="button" id="btn-anterior" class="btn-secundario">Voltar</button>
                <button type="button" id="btn-proximo">Próxima categoria</button>
                <button type="submit" id="btn-votar" class="btn-confirmar">Revisar meus votos</button>
            </div>
        </form>
    </div>

    <!-- TELA 3: REVISÃO E COMPROVANTE -->
    <div id="tela-resumo" class="container" style="display: none;">
        <img src="coren_logo.png" alt="Logo COREN-PE" class="logo-cabecalho" style="display: block; margin: 0 auto 20px;">
        <div class="cargo-header" id="header-resumo">
            <h2>Revise seus votos</h2>
            <p>Confira as escolhas abaixo. Depois de confirmado, o voto não poderá ser alterado.</p>
        </div>

        <div class="resumo-grid" id="lista-resumo"></div>

        <div id="mensagem-sucesso" style="display: none;">
            <h3>Voto confirmado com sucesso!</h3>
            <p>Obrigado por participar da Votação Destaques 2026.</p>
            <button type="button" onclick="window.location.reload()">Encerrar</button>
        </div>

        <div class="navegacao-botoes" id="botoes-resumo">
            <button type="button" id="btn-voltar-edicao" class="btn-secundario">Voltar e editar</button>
            <button type="button" id="btn-confirmar-final">Confirmar voto</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
